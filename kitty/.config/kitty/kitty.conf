# kitty — n1ghtw1ng terminal configuration

# Font (Nerd Font is required by the Starship prompt)
font_family      "JetBrainsMono Nerd Font"
font_size         11.0

# Colors
include            n1ghtw1ng_theme.conf

# Mouse/clipboard
allow_cloning      ask
clipboard_control  write-clipboard write-primary
clipboard_max_size 512
allow_hyperlinks   yes

# Scrollback
scrollback_lines   10000

# Terminal type
term               xterm-kitty

# Background opacity (default is opaque)
# background_opacity 0.9

# Key mappings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Window management
map ctrl+shift+t new_window
map ctrl+shift+w close_window
map ctrl+shift+d next_window
map ctrl+shift+a previous_window

# Tab management
map ctrl+shift+page_up previous_tab
map ctrl+shift+page_down next_tab

# Font size
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
