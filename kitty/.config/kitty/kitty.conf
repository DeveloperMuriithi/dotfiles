# Basic kitty configuration

# Enable font ligatures
font_family      "JetBrainsMono Nerd Font"
font_size          11.0

# Color scheme
import_theme        n1ghtw1ng_theme.conf

# Enable mouse support
allow_cloning      ask

# Clipboard
clipboard_control  write-clipboard write-primary
clipboard_max_size 512

# Remove command palette shortcut that conflicts with ctrl+shift+l
# map ctrl+shift+l clear_terminal to_cursor_scroll active

# Scroll settings
scroll_back_limit  10000

# Terminal type
term               xterm-kitty

# Allow hyperlinks
allow_hyperlinks   yes

# Background opacity (default is semi-transparent)
# background_opacity 0.9

# Mouse mappings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Window management
map ctrl+shift+t new_window
map ctrl+shift+w close_window
map ctrl+shift+d next_window
map ctrl+shift+a previous_window

# Tab management
map ctrl+shift+page_up previous_tab
map ctrl+shift+page_down next_tab

# Font size
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0