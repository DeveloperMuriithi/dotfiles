# Use custom symbols (Nerd Font required)
format = """$directory$fill$git_branch$git_status$cmd_duration$package$nodejs$python$docker_context
$character"""

# ╭──────────────────────────────────────────────╮
# │              N1GHTW1NG PALETTE               │
# ╰──────────────────────────────────────────────╯

palette = "hacker"

[palettes.hacker]
green = "#00FF87"
cyan = "#00D9FF"
yellow = "#FFD75F"
purple = "#D787FF"
orange = "#FFB86C"
red = "#FF5F56"
white = "#E6EDF3"
dim = "#7F8C8D"

# ───────────────────────────────────────────────
# FILL
# ───────────────────────────────────────────────

[fill]
symbol = " "

# ───────────────────────────────────────────────
# PROMPT
# ───────────────────────────────────────────────

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold purple)'

# ───────────────────────────────────────────────
# DIRECTORY
# ───────────────────────────────────────────────

[directory]
style = 'bold cyan'
format = "[\uf115 $path]($style)[$read_only]($read_only_style)"
read_only_style = 'bold red'
read_only = "\uf023 "
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"

# ───────────────────────────────────────────────
# GIT
# ───────────────────────────────────────────────

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = 'bold purple'
symbol = "\ue0a0 "

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = 'bold cyan'

conflicted = "\uf0e7 "
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = "\uf128 "
stashed = "\uf01c "
modified = "\uf044 "
staged = "\uf067 "
renamed = '󰑕 '
deleted = "\uf014 "

# ───────────────────────────────────────────────
# COMMAND DURATION
# ───────────────────────────────────────────────

[cmd_duration]
min_time = 2000
format = "[\uf252 $duration]($style)"
style = 'bold yellow'

# ───────────────────────────────────────────────
# NODE
# ───────────────────────────────────────────────

[nodejs]
format = '[ $symbol($version)]($style)'
symbol = "\ue718 "
style = 'bold green'

# ───────────────────────────────────────────────
# PYTHON
# ───────────────────────────────────────────────

[python]
format = '[ $symbol$version]($style)'
symbol = "\ue73c "
style = 'bold yellow'

# ───────────────────────────────────────────────
# DOCKER
# ───────────────────────────────────────────────

[docker_context]
format = '[ $symbol$context]($style)'
symbol = "\uf308 "
style = 'bold orange'

# ───────────────────────────────────────────────
# PACKAGE
# ───────────────────────────────────────────────

[package]
format = '[ $symbol$version]($style)'
symbol = '󰏗 '
style = 'bold orange'

# ───────────────────────────────────────────────
# DISABLED
# ───────────────────────────────────────────────

[gcloud]
disabled = true

[rust]
disabled = true

[golang]
disabled = true